<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annonces catalogue</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Annonces catalogue</strong>
    <button type="button" id="btn-settings" class="link" aria-expanded="false">Réglages</button>
  </header>

  <section id="settings" class="panel">
    <label>Adresse de la boutique
      <input type="url" id="shop-url" placeholder="https://exemple.com/ma-boutique" autocomplete="off" spellcheck="false">
    </label>
    <p class="hint">Collez l’adresse de la boutique (sans /api), même si elle finit par /boutique.php. L’extension ajoute /api/annonces toute seule.</p>
    <label>Jeton
      <input type="text" id="token" class="token" placeholder="Collez ici le jeton am_…" autocomplete="off" spellcheck="false" autocapitalize="off">
    </label>
    <p class="hint">Le jeton s’affiche en clair pour vérifier le collage (créé une seule fois dans l’admin).</p>
    <div class="row">
      <button type="button" id="btn-save">Enregistrer</button>
      <button type="button" id="btn-ping" class="ghost">Tester</button>
    </div>
    <p id="settings-msg" class="msg" role="status"></p>
  </section>

  <section id="main" class="panel">
    <p id="conn" class="msg">Configurez la boutique dans Réglages.</p>
    <div class="row">
      <input type="search" id="q" placeholder="Chercher un article…" disabled>
      <button type="button" id="btn-search" disabled>OK</button>
    </div>
    <ul id="list" class="list"></ul>
    <div id="detail" class="detail" hidden></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
