# Intégration continue : contrôles uniquement. Aucun déploiement n'est lancé d'ici
# (le déploiement se fait en local avec scripts/release.sh — voir DEPLOIEMENT.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, gd, curl, mbstring, intl, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntaxe PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.venv/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Tests PHPUnit
        run: vendor/bin/phpunit --no-coverage --colors=never

      - name: Tests impression navigateur
        run: node --test tests/fichero-print.test.js

      - name: Aucun secret suivi par git
        run: |
          if git ls-files | grep -qE '(^|/)\.env|\.(key|pem|p12)$|(^|/)config\.local\.php$'; then
            echo "Un secret semble suivi par git" >&2
            git ls-files | grep -E '(^|/)\.env|\.(key|pem|p12)$|(^|/)config\.local\.php$' >&2
            exit 1
          fi
